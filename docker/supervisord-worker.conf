[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:queue-worker]
command=/bin/sh -lc "exec php artisan queue:work %(ENV_QUEUE_CONNECTION)s --queue=%(ENV_REDIS_QUEUE)s --sleep=%(ENV_QUEUE_WORKER_SLEEP)s --tries=%(ENV_QUEUE_WORKER_TRIES)s --backoff=%(ENV_QUEUE_WORKER_BACKOFF)s --timeout=%(ENV_QUEUE_WORKER_TIMEOUT)s --max-time=%(ENV_QUEUE_WORKER_MAX_TIME)s --memory=%(ENV_QUEUE_WORKER_MEMORY)s --no-interaction"
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=100
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:scheduler]
command=php artisan schedule:work --verbose --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
